<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b100f" />
  <title>MC Server — Sign In</title>
  <link rel="icon" type="image/svg+xml" href="mc-logo.svg" />
  <script src="/theme.js"></script>
  <style>
    :root {
      color-scheme: dark;

      --ink:        #e9f0ea;
      --ink-soft:   #aab9b0;
      --ink-faint:  #71827a;
      --panel:      rgba(11, 16, 15, 0.76);
      --line:       rgba(255, 255, 255, 0.09);
      --line-strong:rgba(255, 255, 255, 0.18);
      --grass:      #62c13e;
      --grass-deep: #3f8f26;
      --focus:      #52d4c8;
      --focus-ring: rgba(82, 212, 200, 0.2);
      --red-text:   #ffb4ab;
      --error-bg:   rgba(236, 91, 78, 0.12);
      --error-line: rgba(236, 91, 78, 0.4);
      --field-bg:   rgba(0, 0, 0, 0.35);
      --field-shadow: rgba(0, 0, 0, 0.35);
      --edge:       rgba(0, 0, 0, 0.4);
      --text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
      --card-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 24px 70px rgba(0, 0, 0, 0.55);
      --bg-filter:  blur(8px) brightness(0.68) saturate(1.15);
      --bg-shade:
        radial-gradient(120% 80% at 50% 0%, transparent 40%, rgba(5, 8, 8, 0.45) 100%),
        linear-gradient(to bottom, rgba(5, 8, 8, 0.15), rgba(5, 8, 8, 0.5));
      --font:       system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    :root[data-theme="light"] {
      color-scheme: light;

      --ink:        #14201a;
      --ink-soft:   #44554b;
      --ink-faint:  #6a7b71;
      --panel:      rgba(255, 255, 255, 0.78);
      --line:       rgba(20, 40, 30, 0.13);
      --line-strong:rgba(20, 40, 30, 0.26);
      --focus:      #0b7a70;
      --focus-ring: rgba(11, 122, 112, 0.22);
      --red-text:   #a8231a;
      --error-bg:   rgba(236, 91, 78, 0.1);
      --error-line: rgba(200, 60, 50, 0.45);
      --field-bg:   rgba(255, 255, 255, 0.85);
      --field-shadow: rgba(20, 40, 30, 0.12);
      --edge:       rgba(20, 40, 30, 0.28);
      --text-shadow: 0 1px 8px rgba(255, 255, 255, 0.7);
      --card-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9), 0 20px 56px rgba(30, 55, 40, 0.22);
      --bg-filter:  blur(8px) brightness(1.08) saturate(1.05);
      --bg-shade:
        linear-gradient(to bottom, rgba(238, 245, 238, 0.42), rgba(238, 245, 238, 0.72));
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .bg {
      position: fixed;
      inset: -20px;
      background: url('bg.jpg') center/cover no-repeat;
      filter: var(--bg-filter);
      z-index: 0;
    }
    .bg-shade {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: var(--bg-shade);
      pointer-events: none;
    }

    .theme-toggle {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 2;
      display: grid;
      place-items: center;
      width: 36px;
      height: 35px;
      color: var(--ink-soft);
      background: var(--panel);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--line);
      border-radius: 6px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .theme-toggle:hover { color: var(--ink); border-color: var(--line-strong); }
    .theme-toggle svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .theme-toggle .i-sun  { display: none; }
    :root[data-theme="dark"]  .theme-toggle .i-sun  { display: block; }
    :root[data-theme="dark"]  .theme-toggle .i-moon { display: none; }

    .page {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      width: 100%;
      max-width: 420px;
      padding: 24px 16px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      text-align: center;
    }

    .logo {
      width: 96px;
      height: 96px;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.45));
    }

    .tagline {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      text-shadow: var(--text-shadow);
    }
    .tagline-name {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
    .tagline-sub {
      font-size: 13px;
      font-style: italic;
      color: var(--ink-faint);
    }

    .card {
      position: relative;
      width: 100%;
      padding: 30px 28px 28px;
      background: var(--panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: var(--card-shadow);
    }
    .card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
      border-radius: 10px 0 0 10px;
      background: var(--grass);
    }

    .card-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 22px;
    }

    .field { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--ink-soft);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      font-family: inherit;
      font-size: 15px;
      color: var(--ink);
      background: var(--field-bg);
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      outline: none;
      box-shadow: inset 0 2px 0 var(--field-shadow);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus {
      border-color: var(--focus);
      box-shadow: inset 0 2px 0 var(--field-shadow), 0 0 0 3px var(--focus-ring);
    }

    .error {
      display: none;
      margin-bottom: 18px;
      padding: 11px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--red-text);
      background: var(--error-bg);
      border: 1px solid var(--error-line);
      border-radius: 6px;
    }

    button[type="submit"] {
      width: 100%;
      margin-top: 8px;
      padding: 13px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.03em;
      color: #0b1a07;
      background: var(--grass);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, 0.35),
        inset 0 -4px 0 var(--grass-deep),
        0 4px 0 var(--edge);
      transition: filter 0.15s, transform 0.08s;
    }
    button[type="submit"]:hover { filter: brightness(1.08); }
    button[type="submit"]:active {
      transform: translateY(2px);
      box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.35), inset 0 -4px 0 var(--grass-deep), 0 2px 0 var(--edge);
    }
    button:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="bg-shade"></div>

  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch theme" title="Switch theme">
    <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>

  <div class="page">
    <div class="brand">
      <img class="logo" src="/mc-logo.svg" alt="Minecraft" />
      <div class="tagline">
        <div class="tagline-name">Peter's giant horse cock</div>
        <div class="tagline-sub">8===D</div>
      </div>
    </div>

    <main class="card">
      <h1 class="card-title">Sign in to continue</h1>

      <form method="POST" action="/login">
        <div id="error-msg" class="error" role="alert">Incorrect username or password.</div>

        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" autofocus required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required />
        </div>

        <button type="submit">Sign In</button>
      </form>
    </main>
  </div>

  <script>
    const params = new URLSearchParams(location.search)
    if (params.get('error')) {
      document.getElementById('error-msg').style.display = 'block'
    }
  </script>
</body>
</html>
