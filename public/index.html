<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MC Server</title>
  <link rel="icon" type="image/svg+xml" href="mc-logo.svg" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .bg {
      position: fixed;
      inset: -20px;
      background: url('bg.jpg') center/cover no-repeat;
      filter: blur(12px) brightness(0.45);
      z-index: 0;
    }

    .layout {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      width: 100%;
      padding: 24px 16px;
    }

    .page {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
      max-width: 440px;
    }

    .logo {
      width: 140px;
      height: auto;
      display: block;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
    }

    .card {
      background: rgba(15, 17, 23, 0.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 28px 32px;
      width: 100%;
      box-shadow: 0 24px 80px rgba(0,0,0,0.6);
      text-align: center;
    }

    .card-icon {
      width: 64px;
      height: 64px;
      object-fit: contain;
      margin-bottom: 12px;
      image-rendering: pixelated;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      margin-bottom: 16px;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #64748b;
      transition: background 0.3s;
      flex-shrink: 0;
    }
    .dot.online  { background: #22c55e; box-shadow: 0 0 8px #22c55e88; }
    .dot.offline { background: #ef4444; }
    .dot.loading { background: #f59e0b; }

    .status-text {
      font-size: 14px;
      color: #94a3b8;
    }

    .card-meta {
      font-size: 12px;
      color: #475569;
      margin-bottom: 16px;
      min-height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .card-meta .players { color: #64748b; }
    .card-meta .sep     { color: #2d3748; }

    .btn-row {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .btn-start { background: #22c55e; color: #fff; }
    .btn-stop  { background: #ef4444; color: #fff; }
    .btn-start:hover:not(:disabled) { opacity: 0.88; }
    .btn-stop:hover:not(:disabled)  { opacity: 0.88; }

    .hidden { display: none; }

    .feedback {
      margin-top: 12px;
      font-size: 12px;
      color: #64748b;
      min-height: 18px;
    }

    .autostop {
      margin-top: 8px;
      font-size: 12px;
      color: #f59e0b;
      min-height: 16px;
    }

    .logout {
      display: block;
      font-size: 13px;
      color: #475569;
      text-decoration: none;
    }
    .logout:hover { color: #94a3b8; }

    /* Log panel */
    .log-panel {
      position: fixed;
      right: 24px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(15, 17, 23, 0.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 20px;
      width: 240px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.6);
      z-index: 2;
    }

    .log-panel-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #475569;
      margin-bottom: 14px;
    }

    .log-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      max-height: 520px;
    }

    .log-entry {
      border-left: 2px solid #1e293b;
      padding-left: 10px;
    }
    .log-entry.start { border-color: #22c55e; }
    .log-entry.stop  { border-color: #ef4444; }

    .log-action {
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
    }
    .log-entry.start .log-action { color: #4ade80; }
    .log-entry.stop  .log-action { color: #f87171; }

    .log-meta {
      font-size: 11px;
      color: #475569;
      margin-top: 2px;
    }

    .log-empty {
      font-size: 12px;
      color: #334155;
      text-align: center;
      padding: 20px 0;
    }

    @media (max-width: 760px) {
      .log-panel { display: none; }
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="layout">
    <div class="page">
      <img class="logo" src="/mc-logo.svg" alt="Minecraft" />

      <div class="card" id="card-mc">
        <img class="card-icon" src="/mc-logo.svg" alt="Survival" />
        <div class="card-title">Survival :25565</div>
        <div class="status-row">
          <div class="dot loading" id="dot-mc"></div>
          <span class="status-text" id="status-mc">Checking…</span>
        </div>
        <div class="card-meta" id="meta-mc"></div>
        <div class="btn-row">
          <button class="btn-start hidden" id="start-mc" onclick="action('mc','start')">Start</button>
          <button class="btn-stop  hidden" id="stop-mc"  onclick="action('mc','stop')">Stop</button>
        </div>
        <div class="feedback" id="feedback-mc"></div>
        <div class="autostop" id="autostop-mc"></div>
      </div>

      <div class="card" id="card-skyblock">
        <img class="card-icon" src="/skyblock-icon.png" alt="Skyblock" />
        <div class="card-title">Skyblock :25566</div>
        <div class="status-row">
          <div class="dot loading" id="dot-skyblock"></div>
          <span class="status-text" id="status-skyblock">Checking…</span>
        </div>
        <div class="card-meta" id="meta-skyblock"></div>
        <div class="btn-row">
          <button class="btn-start hidden" id="start-skyblock" onclick="action('skyblock','start')">Start</button>
          <button class="btn-stop  hidden" id="stop-skyblock"  onclick="action('skyblock','stop')">Stop</button>
        </div>
        <div class="feedback" id="feedback-skyblock"></div>
        <div class="autostop" id="autostop-skyblock"></div>
      </div>

      <a href="/logout" class="logout">Sign out</a>
    </div>
  </div>

  <div class="log-panel">
    <div class="log-panel-title">Activity</div>
    <div class="log-list" id="log-list">
      <div class="log-empty">No activity yet</div>
    </div>
  </div>

  <script>
    const SERVER_LABELS = { mc: 'Survival', skyblock: 'Skyblock' }

    function formatUptime(s) {
      if (!s) return null
      const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60)
      if (h > 0) return `↑ ${h}h ${m}m`
      if (m > 0) return `↑ ${m}m`
      return `↑ <1m`
    }

    function formatAutoStop(s) {
      if (s === null) return ''
      const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60)
      if (h > 0) return `Auto-stop in ${h}h ${m}m`
      if (m > 0) return `Auto-stop in ${m}m`
      return `Auto-stop in <1m`
    }

    async function poll(server) {
      try {
        const res = await fetch('/api/status?server=' + server)
        const data = await res.json()
        if (data.missing) {
          setState(server, 'missing', 'Container not found', null, null, null)
        } else {
          setState(server, data.running ? 'online' : 'offline', data.status, data.uptime, data.players, data.autoStopIn)
        }
      } catch {
        setState(server, 'error', 'Could not reach server', null, null, null)
      }
    }

    function setState(server, state, label, uptime, players, autoStopIn) {
      const dot      = document.getElementById('dot-' + server)
      const text     = document.getElementById('status-' + server)
      const btnStart = document.getElementById('start-' + server)
      const btnStop  = document.getElementById('stop-' + server)
      const feedback = document.getElementById('feedback-' + server)
      const meta     = document.getElementById('meta-' + server)
      const autostop = document.getElementById('autostop-' + server)

      dot.className = 'dot ' + (state === 'online' ? 'online' : state === 'offline' ? 'offline' : 'loading')
      text.textContent = label || state

      btnStart.classList.toggle('hidden', state !== 'offline' && state !== 'missing')
      btnStop.classList.toggle('hidden',  state !== 'online')

      if (state === 'online' || state === 'offline') feedback.textContent = ''

      if (state === 'online') {
        const parts = []
        const up = formatUptime(uptime)
        if (up) parts.push(`<span>${up}</span>`)
        if (players !== null) parts.push(`<span class="sep">·</span><span class="players">${players.online} / ${players.max} online</span>`)
        meta.innerHTML = parts.join('')
        autostop.textContent = formatAutoStop(autoStopIn)
      } else {
        meta.innerHTML = ''
        autostop.textContent = ''
      }
    }

    async function action(server, cmd) {
      const btnId   = (cmd === 'start' ? 'start-' : 'stop-') + server
      const btn      = document.getElementById(btnId)
      const feedback = document.getElementById('feedback-' + server)
      btn.disabled = true
      setState(server, 'loading', cmd === 'start' ? 'Starting…' : 'Stopping…', null, null, null)
      feedback.textContent = ''

      try {
        const res  = await fetch('/api/' + cmd + '?server=' + server, { method: 'POST' })
        const data = await res.json()
        if (!data.ok) throw new Error(data.error || 'Unknown error')
        feedback.textContent = cmd === 'start' ? 'Starting up…' : 'Stopped.'
        setTimeout(() => poll(server), 2000)
        pollLog()
      } catch (e) {
        feedback.textContent = 'Error: ' + e.message
        poll(server)
      } finally {
        btn.disabled = false
      }
    }

    async function pollLog() {
      try {
        const res = await fetch('/api/log')
        const entries = await res.json()
        const list = document.getElementById('log-list')
        if (!entries.length) {
          list.innerHTML = '<div class="log-empty">No activity yet</div>'
          return
        }
        list.innerHTML = entries.map(e => {
          const d = new Date(e.time)
          const time = d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' })
            + ' ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })
          const label = SERVER_LABELS[e.server] || e.server
          const verb  = e.action === 'start' ? 'Started' : 'Stopped'
          return `<div class="log-entry ${e.action}">
            <div class="log-action">${verb} ${label}</div>
            <div class="log-meta">${e.ip} · ${time}</div>
          </div>`
        }).join('')
      } catch {}
    }

    const SERVERS = ['mc', 'skyblock']
    SERVERS.forEach(s => {
      poll(s)
      setInterval(() => poll(s), 8000)
    })
    pollLog()
    setInterval(pollLog, 15000)
  </script>
</body>
</html>
