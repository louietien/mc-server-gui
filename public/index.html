<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MC Server</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 16px;
      padding: 48px 56px;
      text-align: center;
      width: 100%;
      max-width: 380px;
    }

    .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      color: #f1f5f9;
      margin-bottom: 32px;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 36px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #64748b;
      transition: background 0.3s;
      flex-shrink: 0;
    }
    .dot.online  { background: #22c55e; box-shadow: 0 0 8px #22c55e88; }
    .dot.offline { background: #ef4444; }
    .dot.loading { background: #f59e0b; }

    .status-text {
      font-size: 15px;
      color: #94a3b8;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    #btn-start {
      background: #22c55e;
      color: #fff;
    }
    #btn-stop {
      background: #ef4444;
      color: #fff;
    }
    #btn-start:hover:not(:disabled) { opacity: 0.88; }
    #btn-stop:hover:not(:disabled)  { opacity: 0.88; }

    .hidden { display: none; }

    .feedback {
      margin-top: 16px;
      font-size: 13px;
      color: #64748b;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⛏️</div>
    <h1>Minecraft Server</h1>

    <div class="status-row">
      <div class="dot loading" id="dot"></div>
      <span class="status-text" id="status-text">Checking…</span>
    </div>

    <button id="btn-start" class="hidden" onclick="action('start')">Start Server</button>
    <button id="btn-stop"  class="hidden" onclick="action('stop')">Stop Server</button>

    <div class="feedback" id="feedback"></div>
  </div>

  <script>
    let currentState = null

    async function poll() {
      try {
        const res = await fetch('/api/status')
        const data = await res.json()
        setState(data.running ? 'online' : 'offline', data.status)
      } catch {
        setState('error', 'Could not reach server')
      }
    }

    function setState(state, label) {
      const dot = document.getElementById('dot')
      const text = document.getElementById('status-text')
      const btnStart = document.getElementById('btn-start')
      const btnStop = document.getElementById('btn-stop')

      dot.className = 'dot ' + (state === 'online' ? 'online' : state === 'offline' ? 'offline' : 'loading')
      text.textContent = label || state

      btnStart.classList.toggle('hidden', state !== 'offline')
      btnStop.classList.toggle('hidden', state !== 'online')
      currentState = state
    }

    async function action(cmd) {
      const btn = document.getElementById(cmd === 'start' ? 'btn-start' : 'btn-stop')
      const feedback = document.getElementById('feedback')
      btn.disabled = true
      setState('loading', cmd === 'start' ? 'Starting…' : 'Stopping…')
      feedback.textContent = ''

      try {
        const res = await fetch('/api/' + cmd, { method: 'POST' })
        const data = await res.json()
        if (!data.ok) throw new Error(data.error || 'Unknown error')
        feedback.textContent = cmd === 'start' ? 'Server is starting up…' : 'Server stopped.'
        setTimeout(poll, 2000)
      } catch (e) {
        feedback.textContent = 'Error: ' + e.message
        poll()
      } finally {
        btn.disabled = false
      }
    }

    poll()
    setInterval(poll, 8000)
  </script>
</body>
</html>
